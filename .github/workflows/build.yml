name: Build
on:
  push:
    branches:
      - main
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Set SDL_VIDEO_DRIVER
        run: echo "SDL_VIDEO_DRIVER=dummy" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Install dependencies
        run: 'sudo apt install -y gcovr nlohmann-json3-dev libopenxr-dev libx11-dev'
      - name: Configure CMake
        run: 'cmake --preset=github -DCMAKE_BUILD_TYPE="Debug"'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: timeout 5s build/boson || [ $? -eq 124 ]
      - name: Run tests
        run: |
          cp CTestCustom.cmake build
          cd build
          (timeout 5s ctest -T Test -T Coverage) || [ $? -eq 124 ]
          cd ../
      - name: Generate Cobertura report
        run: 'gcovr --cobertura build/coverage.xml --exclude build/vcpkg_installed'
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Install SDL3 from DMG
        run: |
          curl -OL https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-3.4.8.dmg
          hdiutil attach SDL3-3.4.8.dmg
          mkdir -p ~/Library/Frameworks
          cp -R /Volumes/SDL3/SDL3.xcframework ~/Library/Frameworks
          cp -R /Volumes/SDL3/share ~/Library/Frameworks
          hdiutil detach /Volumes/SDL3
          rm SDL3-3.4.8.dmg
      - name: Move custom vcpkg - use official SDL3 release
        run: 'mv vcpkg.no-sdl3.json vcpkg.json'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i '' "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update CMakePresets.json
        run: sed -i '' "s|Ninja|Xcode|g" CMakePresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Install dependencies
        run: 'brew install coreutils imagemagick inkscape'
      - name: Create macOS application icon
        run: |
          mkdir -p resources/macos/Boson.iconset
          inkscape -w 1024 -o resources/macos/Boson.iconset/icon_512x512@2x.png resources/shared/icon.svg
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 512 resources/macos/Boson.iconset/icon_512x512.png
          cp resources/macos/Boson.iconset/icon_512x512.png resources/macos/Boson.iconset/icon_256x256@2x.png
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 256 resources/macos/Boson.iconset/icon_256x256.png
          cp resources/macos/Boson.iconset/icon_256x256.png resources/macos/Boson.iconset/icon_128x128@2x.png
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 128 resources/macos/Boson.iconset/icon_128x128.png
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 64 resources/macos/Boson.iconset/icon_32x32@2x.png
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 32 resources/macos/Boson.iconset/icon_32x32.png
          cp resources/macos/Boson.iconset/icon_32x32.png resources/macos/Boson.iconset/icon_16x16@2x.png
          magick resources/macos/Boson.iconset/icon_512x512@2x.png -resize 16 resources/macos/Boson.iconset/icon_16x16.png
          iconutil -c icns resources/macos/Boson.iconset
      - name: Configure CMake
        run: 'cmake --preset=github'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build --config Release'
      - name: Execute
        run: gtimeout 5s build/Release/Boson.app/Contents/MacOS/Boson || [ $? -eq 124 ]
      - name: Remove SDL3 framework from Release path
        run: rm -rf build/Release/SDL3.*
      - name: Upload macOS application bundle
        uses: actions/upload-artifact@v7
        with:
          name: Boson
          path: build/Release/
  build-steamrt4:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Move custom vcpkg - use platform SDL3
        run: 'mv vcpkg.no-sdl3.json vcpkg.json'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set SDL_VIDEO_DRIVER
        run: echo "SDL_VIDEO_DRIVER=dummy" >> $GITHUB_ENV
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Configure CMake
        run: 'cmake --preset=github -DCMAKE_BUILD_TYPE="MinSizeRel"'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: timeout 5s build/boson || [ $? -eq 124 ]
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: 'sudo apt update && sudo apt install -y flatpak flatpak-builder'
      - name: Add Flathub repository
        run: 'flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo'
      - name: Build Flatpak
        run: |
          mkdir -p build/files/share/applications/ build/files/share/icons/hicolor/scalable/apps/
          cp resources/shared/icon.svg build/files/share/icons/hicolor/scalable/apps/tv.kenley.boson.Boson.svg
          cp resources/linux/boson.desktop build/files/share/applications/tv.kenley.boson.Boson.desktop
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo --install build resources/linux/tv.kenley.boson.Boson.yml --disable-rofiles-fuse
      - name: Execute
        run: 'timeout 5s flatpak run --env=SDL_VIDEO_DRIVER=dummy tv.kenley.boson.Boson || [ $? -eq 124 ]'
      - name: Build single-file bundle
        run: 'flatpak build-bundle repo boson.flatpak tv.kenley.boson.Boson --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo'
      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: Flatpak
          path: boson.flatpak
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'false'
      - name: Execute vswhere
        run: vswhere
      - name: List installed MSVC versions
        run: dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
        shell: cmd
      - name: List installed Windows SDK versions
        run: dir "C:\Program Files (x86)\Windows Kits\10\bin\"
        shell: cmd
      - name: Bootstrap vcpkg
        run: 'cd $VCPKG_INSTALLATION_ROOT && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update CMakePresets.json
        run: sed -i "s|Ninja|Visual Studio 17 2022|g" CMakePresets.json
      - name: Configure CMake
        run: 'cmake --preset=github-windows -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build --config Release'
      - name: Execute
        run: 'timeout 5s build/Release/boson || [ $? -eq 124 ]'
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/Release