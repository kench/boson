name: Build
on:
  push:
    branches:
      - main
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: 'sudo apt install -y gcovr nlohmann-json3-dev'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: './build/boson'
      - name: Run tests
        run: 'cd build && ctest -T Test -T Coverage && cd ../'
      - name: Generate Cobertura report
        run: 'gcovr --cobertura build/coverage.xml'
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
  build-steamrt4:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: 'apt install -y gcovr nlohmann-json3-dev'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: './build/boson'

