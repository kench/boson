name: Build
on:
  push:
    branches:
      - main
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Install dependencies
        run: 'sudo apt install -y gcovr nlohmann-json3-dev'
      - name: Configure CMake
        run: 'cmake --preset=github'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: './build/boson'
      - name: Run tests
        run: 'cp CTestCustom.cmake build && cd build && ctest -T Test -T Coverage && cd ../'
      - name: Generate Cobertura report
        run: 'gcovr --cobertura build/coverage.xml --exclude build/vcpkg_installed'
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i '' "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Install dependencies
        run: 'brew install gcovr'
      - name: Configure CMake
        run: 'cmake --preset=github'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: './build/boson'
  build-steamrt4:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: 'cd vendor/vcpkg && ./bootstrap-vcpkg.sh'
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> $GITHUB_ENV
      - name: Update CMakeUserPresets.json
        run: sed -i "s|REPLACE_WITH_VCPKG_ROOT|$VCPKG_ROOT|g" CMakeUserPresets.json
      - name: Update PATH
        run: echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
      - name: Install dependencies
        run: 'apt install -y gcovr nlohmann-json3-dev'
      - name: Configure CMake
        run: 'cmake --preset=github'
      - name: Configure
        run: 'cmake -B build'
      - name: Build
        run: 'cmake --build build'
      - name: Execute
        run: './build/boson'
  build-steamrt4-flatpak:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Install Flatpak
        run: 'apt install -y flatpak'
      - name: Add Flathub repository
        run: 'flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo'
      - name: Build Flatpak
        run: 'mkdir -p build/files/share/applications/ && cp resources/linux/boson.desktop build/files/share/applications/tv.kenley.boson.Boson.desktop && flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo --install build resources/linux/tv.kenley.boson.Boson.yml'