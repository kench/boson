id: tv.kenley.boson.Boson
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: boson
modules:
  - name: boson
    buildsystem: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE="MinSizeRel"
    sources:
      - type: git
        url: https://github.com/kench/boson.git
        branch: main
        disable-submodules: true
    modules:
      - name: ixwebsocket
        buildsystem: cmake
        sources:
          - type: archive
            url: https://github.com/machinezone/IXWebSocket/archive/refs/tags/v12.0.0.tar.gz
            sha256: f193bc24e10c18ab8d31d6f31370fde8b31d3eaf1de32e1d8ab14d666659b8ad
      - name: nlohmann-json
        buildsystem: cmake
        config-opts:
          - -D JSON_BuildTests=OFF
        sources:
          - type: archive
            url: https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz
            sha256: 42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa
      - name: openxr
        buildsystem: cmake
        sources:
          - type: archive
            url: https://github.com/KhronosGroup/OpenXR-SDK/archive/refs/tags/release-1.1.60.tar.gz
            sha256: a55afd26df6cb41ea8217e8375e3d4ffabdef047141f22ffe725d1c3adb1c43b
      - name: sdl3
        buildsystem: cmake
        sources:
          - type: archive
            url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-3.4.8.tar.gz
            sha256: e9fff7467fb60f037e6708da18b25560649e4c63edc2a69bb871b960d9cbfbba